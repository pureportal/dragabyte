name: dragabyte
base: core24
version: "1.0.1"
icon: apps/client/src-tauri/icons/icon.png
summary: Disk usage scanner and bulk rename utility
description: |
  Dragabyte is a desktop utility for scanning folder usage,
  finding the biggest files, and performing bulk rename operations.

grade: stable
confinement: strict

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1

apps:
  dragabyte:
    command: usr/bin/dragabyte
    desktop: usr/share/applications/Dragabyte.desktop
    extensions: [gnome]

parts:
  build-app:
    plugin: dump
    source: .
    build-snaps:
      - node/24/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - dpkg
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu
      rustup default stable
      npm ci
      npm run tauri:build:linux -- --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'
      dpkg -x apps/client/src-tauri/target/release/bundle/deb/*.deb "$CRAFT_PART_INSTALL/"
      sed -i 's|^Icon=.*|Icon=${SNAP}/meta/gui/icon.png|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/Dragabyte.desktop"
