[package]
name = "dragabyte"
version = "0.7.4"
edition = "2021"
rust-version = "1.88"
default-run = "dragabyte"

[[bin]]
name = "dragabyte"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "dragabyte-cli"
path = "src/bin/dragabyte-cli.rs"
required-features = ["terminal"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dependencies]
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
tauri = { version = "2.11.5", features = [], optional = true }
tauri-plugin-dialog = { version = "2.7.3", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-updater = { version = "2.11.0", features = ["rustls-tls"], optional = true }
tauri-plugin-window-state = { version = "2.4.1", optional = true }
base64 = "0.22.1"
tauri-plugin-fs = { version = "2.5.2", optional = true }
clap = { version = "4.6", features = ["derive", "env"], optional = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "crossterm_0_29"], optional = true }
crossterm = { version = "0.29", optional = true }
ctrlc = { version = "3.5", features = ["termination"], optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = { version = "0.55.0", optional = true }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"], optional = true }

[features]
default = ["terminal"]
terminal = ["dep:clap", "dep:ratatui", "dep:crossterm", "dep:ctrlc"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-process", "dep:tauri-plugin-updater", "dep:tauri-plugin-window-state", "dep:tauri-plugin-fs", "dep:winreg", "dep:windows-sys"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[package.metadata]

[package.metadata.tauri]
