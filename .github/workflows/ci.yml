name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify version sync
        run: npm run sync:version:check
      - name: Check workspace versioning
        run: npm run test:version
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Scan result checks
        run: npm run test:scan
      - name: Build app frontend
        run: npm run build:app
      - name: Build landing page
        run: npm run build:landing
      - name: Upload landing page
        uses: actions/upload-artifact@v4
        with:
          name: landing-page
          path: apps/landing/dist
          if-no-files-found: error
