name: Landing Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  landing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@v3
      - name: Build landing image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          platforms: linux/amd64
          load: true
          tags: dragabyte-landing:smoke
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing
      - name: Smoke-test landing image
        run: node scripts/verify-landing.mjs dragabyte-landing:smoke
      - name: Resolve image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-landing
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,format=long
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish landing image
        if: github.event_name != 'pull_request'
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/landing/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=landing
      - name: Summarize published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Published tags:\n```text\n%s\n```\nDigest: `%s`\n' "$IMAGE_TAGS" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
